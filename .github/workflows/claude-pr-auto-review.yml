name: Claude PR Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Validate CLAUDE_CODE_OAUTH_TOKEN
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set"
            exit 1
          fi
          echo "CLAUDE_CODE_OAUTH_TOKEN is set"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request for code quality, correctness, and security.
            First, get the diff using `gh pr diff ${{ github.event.pull_request.number }}`.
            For each issue found, post an inline review comment using `gh api`:
            gh api repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/comments \
              --method POST \
              --field body='...' \
              --field path='...' \
              --field position=N \
              --field commit_id='${{ github.event.pull_request.head.sha }}'
            The `position` is the line number in the unified diff, counting from the first `@@` hunk header (the hunk header line itself is position 1).
            Do not write comment content to any temporary file first.
            Respond using a Traditional Chinese-English parallel translation format (請使用繁體中英對照的方式回答)。
          claude_args: "--max-turns 20 --model sonnet --allowed-tools Bash(gh pr *),Bash(gh api *)"

      - name: Upload execution output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: ignore

