name: Claude PR Rereview Approve

on:
  issue_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          prompt: |
            Re-review this pull request.
            First, read existing PR comments for context using:
            `gh pr view ${{ github.event.issue.number }} --comments`
            Then get the diff using:
            `gh pr diff ${{ github.event.issue.number }}`
            Consider any justifications provided in the comments before flagging issues.
            - If there are unresolved issues: post inline comments using:
              `gh api repos/$GITHUB_REPOSITORY/pulls/${{ github.event.issue.number }}/comments \
              --method POST \
              --field body='...' \
              --field path='...' \
              --field position=N \
              --field commit_id='...'`
            - If no issues found (including intentional ones explained in comments): approve using `gh pr review ${{ github.event.issue.number }} --approve --body '...'`
            Respond using a Traditional Chinese-English parallel translation format (請使用繁體中英對照的方式回答)。

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools Bash(gh pr *),Bash(gh api *)'

